<div class="layout-wrapper">
  <!-- Sidebar -->
  <div class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
      <img src="assets/logo.png" alt="Logo" class="logo" *ngIf="!isCollapsed" />
      <button pButton icon="pi pi-bars" class="toggle-button" (click)="toggleSidebar()"></button>
    </div>

    <!-- Sidebar Menu -->
    <p-menu [model]="menuItems" [style.width]="isCollapsed ? '80px' : '100%'"></p-menu>
  </div>

  <!-- Main Content Area -->
  <div class="main-content" [class.collapsed]="isCollapsed">
    <!-- Top Bar -->
    <div class="topbar">
      <span class="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <input type="text" pInputText placeholder="Search..." class="topbar-search" />
        <button pButton icon="pi pi-bell" class="topbar-icon"></button>
        <button pButton icon="pi pi-cog" class="topbar-icon"></button>
        <button pButton icon="pi pi-user" class="topbar-icon"></button>
      </div>
    </div>

    <!-- Content Area -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
