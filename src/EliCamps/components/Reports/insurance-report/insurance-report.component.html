<div class="container-fluid">
<div class="user-page">
  <div class="row">
    <div class="col-md-2 form-group">
      <p-dropdown 
        styleClass="w-100"
        [options]="statusList" 
        [(ngModel)]="selectedStatus" 
        optionLabel="name"
        optionValue="name"
        filter="true" 
        placeholder="Status">
        <ng-template pTemplate="selectedItem">
          {{ selectedStatus || 'All' }}
        </ng-template>
      </p-dropdown>
    </div>

    <div class="col-md-2 form-group">
      <p-dropdown 
        styleClass="w-100"
        [options]="programList" 
        [(ngModel)]="program" 
        optionLabel="programName" 
        filter="true" 
        placeholder="Program">
      </p-dropdown>
    </div>

    <div class="col-md-2 form-group">
      <p-dropdown 
        styleClass="w-100"
        [options]="agentList" 
        [(ngModel)]="agent" 
        optionLabel="agent" 
        filter="true" 
        placeholder="Agent">
      </p-dropdown>
    </div>

    <div class="col-md-2 form-group">
      <p-dropdown 
        styleClass="w-100"
        [options]="campusList" 
        [(ngModel)]="campus" 
        optionLabel="campus"
        filter="true"  
        placeholder="Campus">
      </p-dropdown>
    </div>

    <div class="col-md-2 form-group">
      <p-dropdown styleClass="w-100"
        [options]="formatList" 
        [(ngModel)]="format" 
        optionLabel="name" 
        filter="true" 
        placeholder="Format">
      </p-dropdown>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 date-filters">
      <div class="form-group">
        <p-calendar styleClass="w-100"
          [(ngModel)]="startDate" 
          placeholder="From" 
          dateFormat="mm-dd-yy">
        </p-calendar>
      </div>
  
      <div class="form-group">
        <p-calendar styleClass="w-100"
          [(ngModel)]="endDate" 
          placeholder="To" 
          dateFormat="mm-dd-yy">
        </p-calendar>
      </div>
    </div>
    <div class="col-md-6">
    <div class="form-actions">
    <button pButton type="button" label="Show" (click)="filterChage()"></button>
    <button pButton type="button" label="Clear" (click)="clear()"></button>
    <button class="p-button-success" pButton type="button" label="Download" (click)="onBtnExport()"></button>
  </div>
    </div>
  </div>
  <div class="row">

</div>


  <div class="all-show-grid">
    <ag-grid-angular [defaultColDef]="defaultColDef"
      style="height: 100%; max-width: 100%; width: 100vw"
      class="ag-theme-material"
      [getRowStyle]="getRowStyle"
      [gridOptions]="gridOptions"
      [columnDefs]="columnDefs"
      [pinnedBottomRowData]="pinnedBottomRowData"
      [modules]="modules"
      (gridReady)="onGridReady($event)"
      [rowModelType]="'clientSide'"
      [suppressContextMenu]="true"
      #grid
    >
    </ag-grid-angular>
  </div>
</div>
