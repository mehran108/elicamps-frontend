<!-- Main Content area -->
<mat-card class="container-fluid">
  <mat-card-content>
    <form class="form-fields bulk-emails">
      <div class="row">
        <div class="col-md-6">
            <div class="form-group">
              <p-dropdown
                placeholder="Select Agency"
                styleClass="w-100"
                [options]="agentList"
                [(ngModel)]="selectedAgent"
                optionLabel="agent"
                filterBy="agent"
                filter="true"
                (ngModelChange)="onAgentSelect($event)"
              ></p-dropdown>
            </div>
            <div class="form-group">
              <p-multiSelect
                placeholder="Select Students"
                styleClass="w-100"
                [options]="studentList"
                [(ngModel)]="selectedStudents"
                optionLabel="name"
              ></p-multiSelect>
          </div>
            <div class="form-group">
              <p-dropdown
              placeholder="Email Template"
              styleClass="w-100"
              [options]="templateList"
              optionLabel="name"
              [(ngModel)]="selectedTemplate"
              (ngModelChange)="onTemplateSelect($event)"
            >
          </p-dropdown>
          </div>
        </div>
        <div class="col-md-4">
          <div class="row">
            <div class="form-group">
              <mat-checkbox
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="isStudentInvoice"
                class="col-md-2"
                >Student Invoice</mat-checkbox
              >
              <mat-checkbox
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="isAgentInvoice"
                class="col-md-2"
                >Agent Invoice</mat-checkbox
              >
              <mat-checkbox
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="isLoaInvoiceWithNoPrice"
                class="col-md-2"
                >LOA No Price</mat-checkbox
              >
              <mat-checkbox
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="isLoaInvoice"
                class="col-md-2"
                >LOA With Price</mat-checkbox
              >
              <mat-checkbox
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="isLoaGroupInvoice"
                class="col-md-2"
                >LOA - Group</mat-checkbox
              >
              <mat-checkbox
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="isStudentInvitation"
                class="col-md-2"
                >Invitation</mat-checkbox
              >
              <mat-checkbox
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="isAirportInvoice"
                class="col-md-2"
                >Airport Doc</mat-checkbox
              >
              <mat-checkbox
                [ngModelOptions]="{ standalone: true }"
                [(ngModel)]="isStudentCertificate"
                class="col-md-2"
                >Certificate</mat-checkbox
              >
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 form-group">
          <mat-radio-group
            [ngModelOptions]="{ standalone: true }"
            [(ngModel)]="emailType"
          >
            <mat-radio-button [value]="1">Agency</mat-radio-button>&nbsp;&nbsp;
            <mat-radio-button [value]="2">Custom</mat-radio-button>
          </mat-radio-group>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 form-group" *ngIf="emailType == 2">
          <mat-form-field>
            <input
              matInput
              placeholder="Enter Email"
              [ngModelOptions]="{ standalone: true }"
              [(ngModel)]="studentEmail"
            />
          </mat-form-field>
        </div>
      </div>
      <mat-card-actions>
        <div class="action-btns text-right">
          <button
            [disabled]="!(selectedStudents.length && emailBody && studentEmail)"
            mat-raised-button
            class="btn btn-primary m-left"
            color="primary"
            (click)="sendEmail()"
          >
            Send Email
          </button>
        </div>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
